<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Simple Accounting</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========== 横向条形图样式 ========== */
        .chart-container { margin-top: 20px; }
        .chart-row { margin-bottom: 15px; }
        .chart-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .chart-bar-bg { width: 100%; height: 20px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .chart-bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease-in-out; }
        .fill-income { background-color: var(--income-color); }
        .fill-expense { background-color: var(--expense-color); }

        /* ========== 垂直柱状图区域样式 ========== */
        .vertical-charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        @media (max-width: 600px) {
            .vertical-charts-section { grid-template-columns: 1fr; }
        }

        .chart-box h3 {
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
        }

        .vertical-chart-area {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 180px;
            background-color: #f9f9f9;
            border-bottom: 2px solid var(--border-color);
            border-left: 2px solid var(--border-color);
            padding: 0 5px;
            border-radius: 4px;
        }

        body.dark-mode .vertical-chart-area { background-color: #1e1e1e; }

        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 20px;
            height: 100%;
        }

        .bar-fill {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 1s ease-in-out;
            position: relative;
        }

        .bar-fill.income-bar { background-color: var(--income-color); }
        .bar-fill.expense-bar { background-color: var(--expense-color); }

        .bar-fill:hover::after {
            content: attr(data-amount);
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
        }

        .bar-label {
            margin-top: 5px;
            font-size: 10px;
            color: #7f8c8d;
            text-align: center;
            width: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 10px;">
            <h1 style="margin: 0;">💰 Simple Accounting</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">🌙</button>
        </div>
        <nav aria-label="Main Menu">
            <ul>
                 <li><a href="home.html" >Home</a></li>
                <li><a href="records.html">Records</a></li>
                <li><a href="stats.html" aria-current="page">Statistics</a></li>
                <li><a href="quotes.html">Quotes</a></li>
                <!-- 新增的 Mini Game 入口 -->
                <li><a href="game.html">Mini Game</a></li> 
                <li><a href="about.html">About</a></li>
                <li><a href="author.html">Author</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>📊 Data Visualization</h2>
            <p>Based on your current records, here is your visual spending overview:</p>
            
            <div id="stats-content"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simple Accounting Project</p>
    </footer>

    <script>
        const STORAGE_KEY = 'accounting_records';
        const records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const statsEl = document.getElementById('stats-content');

        if (records.length === 0) {
            statsEl.innerHTML = '<p style="text-align:center; color:#7f8c8d;">No data available for analysis yet. Add some records first!</p>';
        } else {
            let totalIncome = 0;
            let totalExpense = 0;
            let incomeRecords = [];
            let expenseRecords = [];

            records.forEach(r => {
                if (r.type === 'income') {
                    totalIncome += r.amount;
                    incomeRecords.push(r);
                } else {
                    totalExpense += r.amount;
                    expenseRecords.push(r);
                }
            });

            const totalFlow = totalIncome + totalExpense;
            
            // ========== 1. 上方：比例进度条 ==========
            let incomePercent = totalFlow === 0 ? 0 : (totalIncome / totalFlow * 100).toFixed(1);
            let expensePercent = totalFlow === 0 ? 0 : (totalExpense / totalFlow * 100).toFixed(1);

            let html = `
                <h3 style="margin-bottom: 15px;">Total Income vs Expense</h3>
                <div class="chart-container">
                    <div class="chart-row">
                        <div class="chart-label">
                            <span>Income</span>
                            <span style="color: var(--income-color);">$${totalIncome.toFixed(2)} (${incomePercent}%)</span>
                        </div>
                        <div class="chart-bar-bg"><div class="chart-bar-fill fill-income" style="width: ${incomePercent}%;"></div></div>
                    </div>
                    <div class="chart-row">
                        <div class="chart-label">
                            <span>Expense</span>
                            <span style="color: var(--expense-color);">$${totalExpense.toFixed(2)} (${expensePercent}%)</span>
                        </div>
                        <div class="chart-bar-bg"><div class="chart-bar-fill fill-expense" style="width: ${expensePercent}%;"></div></div>
                    </div>
                </div>
                
                <div class="vertical-charts-section">
            `;

            // 生成柱状图的通用函数
            function generateBars(recordsArray, typeClass) {
                if (recordsArray.length === 0) return '<p style="text-align:center; font-size:12px; color:#7f8c8d;">No data</p>';
                
                let maxAmount = Math.max(...recordsArray.map(r => r.amount));
                let recent = recordsArray.slice(-6); // 左右各最多显示6根柱子
                let barsHtml = '';

                recent.forEach(r => {
                    let heightPercent = maxAmount === 0 ? 0 : (r.amount / maxAmount * 100);
                    if (heightPercent < 5) heightPercent = 5; 
                    let noteText = r.note || 'No note';
                    let shortNote = noteText.length > 4 ? noteText.substring(0, 4) + '..' : noteText;

                    barsHtml += `
                        <div class="bar-item">
                            <div class="bar-fill ${typeClass}" style="height: ${heightPercent}%;" data-amount="$${r.amount.toFixed(2)}"></div>
                            <span class="bar-label" title="${noteText}">${shortNote}</span>
                        </div>
                    `;
                });
                return barsHtml;
            }

            // ========== 2. 左下方：收入柱状图 ==========
            html += `
                <div class="chart-box">
                    <h3 style="color: var(--income-color);">Recent Income</h3>
                    <div class="vertical-chart-area">
                        ${generateBars(incomeRecords, 'income-bar')}
                    </div>
                </div>
            `;

            // ========== 3. 右下方：支出柱状图 ==========
            html += `
                <div class="chart-box">
                    <h3 style="color: var(--expense-color);">Recent Expense</h3>
                    <div class="vertical-chart-area">
                        ${generateBars(expenseRecords, 'expense-bar')}
                    </div>
                </div>
            `;

            html += `</div>`; // 结束 vertical-charts-section
            statsEl.innerHTML = html;
        }

        // 深色模式逻辑
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') { 
            document.body.classList.add('dark-mode'); 
            if (themeToggleBtn) themeToggleBtn.textContent = '☀️'; 
        }
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) { 
                    themeToggleBtn.textContent = '☀️'; 
                    localStorage.setItem('theme', 'dark'); 
                } else { 
                    themeToggleBtn.textContent = '🌙'; 
                    localStorage.setItem('theme', 'light'); 
                }
            });
        }
    </script>
</body>
</html>
