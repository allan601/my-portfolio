<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records - Simple Accounting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 10px;">
            <h1 style="margin: 0;">💰 Simple Accounting</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">🌙</button>
        </div>
        <nav aria-label="Main Menu">
            <ul>
                 <li><a href="home.html" aria-current="page">Home</a></li>
                <li><a href="records.html">Records</a></li>
                <li><a href="stats.html">Statistics</a></li>
                <li><a href="quotes.html">Quotes</a></li>
                <!-- 新增的 Mini Game 入口 -->
                <li><a href="game.html">Mini Game</a></li> 
                <li><a href="about.html">About</a></li>
                <li><a href="author.html">Author</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section>
            <div class="list-header">
                <h2>📝 Transaction Details</h2>
            </div>
            <ul class="record-list" id="record-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simple Accounting Project</p >
    </footer>

    <script>
        const STORAGE_KEY = 'accounting_records';
        function getRecords() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        function renderList() {
            const records = getRecords();
            const listEl = document.getElementById('record-list');
            records.sort((a, b) => new Date(b.date) - new Date(a.date));
            listEl.innerHTML = '';
            if (records.length === 0) {
                listEl.innerHTML = '<li class="empty-msg">No records yet. Go back to Home to add your first record!</li>';
                return;
            }
            records.forEach(record => {
                const li = document.createElement('li');
                li.className = `record-item ${record.type}`;
                const sign = record.type === 'income' ? '+' : '-';
                li.innerHTML = `
                    <div class="record-info">
                        <span class="record-date">${record.date}</span>
                        <span class="record-note">${record.note || 'No note'}</span>
                    </div>
                    <div class="record-action">
                        <span class="record-amount ${record.type}">${sign}${record.amount.toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteRecord('${record.id}')">Delete</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }
        function deleteRecord(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            let records = getRecords();
            records = records.filter(record => record.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            renderList();
        }
        renderList();

        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); if (themeToggleBtn) themeToggleBtn.textContent = '☀️'; }
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) { themeToggleBtn.textContent = '☀️'; localStorage.setItem('theme', 'dark'); } 
                else { themeToggleBtn.textContent = '🌙'; localStorage.setItem('theme', 'light'); }
            });
        }
    </script>
</body>
</html>
