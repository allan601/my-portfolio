<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game - Simple Accounting</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container { max-width: 600px; margin: 40px auto; text-align: center; }
        .game-info { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 20px; color: var(--text-color); }
        .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; perspective: 1000px; }
        .card { width: 100%; aspect-ratio: 1 / 1; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flip { transform: rotateY(180deg); }
        .card.matched { transform: rotateY(180deg); opacity: 0.6; cursor: default; }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 36px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card-back { background-color: #3498db; color: white; }
        .card-front { background-color: var(--card-bg); transform: rotateY(180deg); border: 2px solid #3498db; }
        .restart-btn { margin-top: 30px; padding: 10px 20px; font-size: 16px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; width: auto; }
        .restart-btn:hover { background-color: #45a049; }
        @media (max-width: 500px) { .game-board { gap: 10px; } .card-front, .card-back { font-size: 24px; } }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 10px;">
            <h1 style="margin: 0;">💰 Simple Accounting</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">🌙</button>
        </div>
        <nav aria-label="Main Menu">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="records.html">Records</a></li>
                <li><a href="stats.html">Statistics</a></li>
                <li><a href="quotes.html">Quotes</a></li>
                <li><a href="game.html" aria-current="page">Mini Game</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="author.html">Author</a></li>
            </ul>
        </nav>
    </header>

    <main class="game-container">
        <div class="game-info">
            <span>Moves: <span id="moves">0</span></span>
            <span id="message"></span>
        </div>
        <div class="game-board" id="game-board"></div>
        <button class="restart-btn" onclick="startGame()">Restart Game</button>
    </main>

    <script>
        const board = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const messageDisplay = document.getElementById('message');
        const emojis = ['💵', '💳', '🪙', '💰', '🧾', '🏦', '💎', '📈'];
        
        let hasFlippedCard = false, lockBoard = false, firstCard, secondCard, moves = 0, matchedPairs = 0;

        function startGame() {
            board.innerHTML = '';
            moves = 0; matchedPairs = 0; movesDisplay.textContent = moves; messageDisplay.textContent = '';
            hasFlippedCard = false; lockBoard = false;

            const gameCards = [...emojis, ...emojis].sort(() => 0.5 - Math.random());

            gameCards.forEach(emoji => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.innerHTML = `<div class="card-back">❓</div><div class="card-front">${emoji}</div>`;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true; firstCard = this; return;
            }

            secondCard = this; moves++; movesDisplay.textContent = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            firstCard.classList.add('matched'); secondCard.classList.add('matched');
            matchedPairs++;
            if (matchedPairs === emojis.length) messageDisplay.textContent = `🎉 You won in ${moves} moves!`;
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip'); secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        function resetBoard() { [hasFlippedCard, lockBoard] = [false, false]; [firstCard, secondCard] = [null, null]; }

        startGame();

        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); if (themeToggleBtn) themeToggleBtn.textContent = '☀️'; }
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) { themeToggleBtn.textContent = '☀️'; localStorage.setItem('theme', 'dark'); } 
                else { themeToggleBtn.textContent = '🌙'; localStorage.setItem('theme', 'light'); }
            });
        }
    </script>
</body>
</html>
