<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Accounting - Cover</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 隐藏滚动条，让封面占据整个屏幕 */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 全屏封面背景（这里我用了 Unsplash 上的高清财务/办公氛围图，你可以换成你本地的图） */
        .landing-container {
            position: relative;
            height: 100vh;
            width: 100%;
            background-image: url('https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=2000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 遮罩层：让文字在图片上更清晰 */
        .landing-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55); 
            z-index: 1;
            transition: background 0.5s ease;
        }

        /* 悬停时遮罩稍微变亮 */
        .landing-container:hover::before {
            background: rgba(0, 0, 0, 0.4); 
        }

        /* 居中的文字区域 */
        .landing-content {
            position: relative;
            z-index: 2;
            color: #ffffff;
            padding: 0 20px;
            animation: fadeIn 1.5s ease-in-out; 
        }

        .landing-content h1 {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .landing-content p {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #e0e0e0;
            margin-bottom: 50px;
        }

        /* 进入按钮 */
        .enter-btn {
            display: inline-block;
            padding: 15px 45px;
            font-size: 16px;
            color: #ffffff;
            background-color: transparent;
            text-decoration: none;
            border: 2px solid #ffffff;
            border-radius: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }

        .enter-btn:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255,255,255,0.3);
        }

        /* 简单的文字淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手机屏幕适配 */
        @media (max-width: 600px) {
            .landing-content h1 { font-size: 38px; }
            .landing-content p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- 全屏落地页容器 -->
    <div class="landing-container">
        <div class="landing-content">
            <h1>Simple Accounting</h1>
            <p>Take control of your finances — beautifully and securely.</p>
            
            <!-- 点击进入按钮，指向真正的记账主页 home.html -->
            <a href="home.html" class="enter-btn">Enter Dashboard</a>
        </div>
    </div>

</body>
</html>
